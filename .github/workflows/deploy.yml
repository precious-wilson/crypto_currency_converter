name: Deploy Serverless Crypto Converter

on:
  push:
    branches:
      - main

jobs:
  deploy-cloud-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Build & Package Backend Lambda
      - name: Install Backend Dependencies
        run: npm install
        working-directory: backend

      - name: Package Backend into Lambda Zip
        run: |
          cd backend
          zip -r ../lambda_function.zip .

      # 2. Provision AWS Infrastructure via Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Terraform Init & Apply Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      # 3. Build React Frontend
      - name: Build React Frontend
        env:
          CI: false
        run: |
          npm install
          npm run build
        working-directory: frontend

      # 4. Sync Built Frontend to S3 and Invalidate CloudFront Cache
      - name: Sync Frontend to S3 & Invalidate Cache
        run: |
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          
          # Upload build folder to the S3 bucket created in frontend.tf
          aws s3 sync frontend/build/ s3://$BUCKET_NAME --delete
          
          # Invalidate CloudFront CDN cache so users instantly see updates
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)
          if [ ! -z "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi
